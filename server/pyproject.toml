[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fitpilot-secure-model-proxy"
version = "1.0.0"
description = "Secure task-shaped backend-for-frontend for FitPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic-settings",
    "pyjwt[crypto]",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
